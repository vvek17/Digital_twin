# Makes the project importable so "backend", "frontend" and "database" resolve
# from anywhere, which is what lets a script be run either way:
#
#     python3 tests/test_twin.py
#     python3 -m tests.test_twin
#
# Install once, in editable mode, so edits take effect without reinstalling:
#
#     pip install -e .

[project]
name = "phishing-twin"
version = "0.1.0"
description = "A digital twin that learns how each member of staff answers phishing email"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "frontend", "database", "scripts", "tests"]
